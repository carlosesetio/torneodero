<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Torneo de Parejas</title>

<!-- Firebase (base de datos gratuita en tiempo real) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<!-- React sin build step -->
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="error-banner" style="display:none; background:#fee; color:#900; padding:12px; font-family:monospace; font-size:12px; white-space:pre-wrap; border-bottom:2px solid #900;"></div>
<div id="root">Cargando…</div>

<script>
  function mostrarError(msg) {
    var b = document.getElementById("error-banner");
    b.style.display = "block";
    b.textContent += msg + "\n";
  }
  window.addEventListener("error", function (e) {
    mostrarError("Error: " + e.message + " (" + (e.filename || "") + ":" + (e.lineno || "") + ")");
  });
  window.addEventListener("unhandledrejection", function (e) {
    var reason = e.reason && e.reason.message ? e.reason.message : e.reason;
    mostrarError("Promesa rechazada: " + reason);
  });
</script>

<script type="text/plain" id="app-source">
